<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Kraken Sprite Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    background: #1a1a2e;
    font-family: monospace;
    color: #ccc;
  }

  .sprite-box {
    position: relative;
    border: 1px dashed rgba(255,255,255,0.2);
  }

  .sprite {
    display: block;
    background-image: url('animation/kraken_sprite.png');
    background-size: 700% 100%;
    background-repeat: no-repeat;
    background-position: 0% 0;
  }

  .size-original .sprite { width: 200px; height: 200px; }
  .size-large    .sprite { width: 400px; height: 400px; }
  .size-small    .sprite { width: 100px; height: 100px; }

  .sprite.playing {
    animation: frames var(--duration) steps(6) infinite;
  }

  .sprite.playing-once {
    animation: frames var(--duration) steps(6) forwards;
  }

  @keyframes frames {
    from { background-position:   0% 0; }
    to   { background-position: 100% 0; }
  }

  /* 7 кадров: позиции i/(N-1)*100% */
  .sprite.frame-0 { background-position:   0%      0; }
  .sprite.frame-1 { background-position:  16.667%  0; }
  .sprite.frame-2 { background-position:  33.333%  0; }
  .sprite.frame-3 { background-position:  50%      0; }
  .sprite.frame-4 { background-position:  66.667%  0; }
  .sprite.frame-5 { background-position:  83.333%  0; }
  .sprite.frame-6 { background-position: 100%      0; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 600px;
  }

  button {
    padding: 8px 16px;
    background: #2a2a4a;
    color: #aac;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
    font-family: monospace;
    font-size: 13px;
  }

  button:hover { background: #3a3a6a; }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #888;
    font-size: 13px;
  }

  input[type="range"] { width: 200px; accent-color: #66f; }

  .info {
    font-size: 12px;
    color: #666;
    text-align: center;
    line-height: 1.6;
  }

  .bg-ocean { background: #0c2340; }
  .bg-gray  { background: #444; }
  .bg-checker {
    background-image:
      linear-gradient(45deg, #222 25%, transparent 25%),
      linear-gradient(-45deg, #222 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #222 75%),
      linear-gradient(-45deg, transparent 75%, #222 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    background-color: #333;
  }

  .all-frames {
    display: flex;
    gap: 4px;
    justify-content: center;
  }

  .all-frames .sprite {
    width: 80px;
    height: 80px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
  }

  .frame-label {
    font-size: 10px;
    color: #666;
    text-align: center;
    margin-top: 2px;
  }
</style>
</head>
<body>

  <h3>🐙 Kraken Sprite — 7 кадров</h3>

  <div class="sprite-box size-original" id="spriteBox">
    <div class="sprite frame-0" id="sprite" style="--duration: 2.4s;"></div>
  </div>

  <div class="controls">
    <button onclick="stop()">⏹ Стоп</button>
    <button onclick="playLoop()">🔄 Цикл</button>
    <button onclick="playOnce()">▶ Один раз</button>
  </div>

  <div class="controls">
    <button onclick="goFrame(0)">F0</button>
    <button onclick="goFrame(1)">F1</button>
    <button onclick="goFrame(2)">F2</button>
    <button onclick="goFrame(3)">F3</button>
    <button onclick="goFrame(4)">F4</button>
    <button onclick="goFrame(5)">F5</button>
    <button onclick="goFrame(6)">F6</button>
  </div>

  <div class="slider-row">
    <span>Скорость:</span>
    <input type="range" id="speedSlider" min="0.2" max="10" step="0.1" value="2.4">
    <span id="speedLabel">2.4s</span>
  </div>

  <div class="controls">
    <button onclick="setSize('size-small')">100px</button>
    <button onclick="setSize('size-original')">200px</button>
    <button onclick="setSize('size-large')">400px</button>
  </div>

  <div class="controls">
    <button onclick="setBg('')">Тёмный</button>
    <button onclick="setBg('bg-ocean')">Океан</button>
    <button onclick="setBg('bg-gray')">Серый</button>
    <button onclick="setBg('bg-checker')">Шашки</button>
  </div>

  <h4 style="margin-top: 20px; color: #888;">Все 7 кадров:</h4>
  <div class="all-frames">
    <div><div class="sprite frame-0"></div><div class="frame-label">0</div></div>
    <div><div class="sprite frame-1"></div><div class="frame-label">1</div></div>
    <div><div class="sprite frame-2"></div><div class="frame-label">2</div></div>
    <div><div class="sprite frame-3"></div><div class="frame-label">3</div></div>
    <div><div class="sprite frame-4"></div><div class="frame-label">4</div></div>
    <div><div class="sprite frame-5"></div><div class="frame-label">5</div></div>
    <div><div class="sprite frame-6"></div><div class="frame-label">6</div></div>
  </div>

  <div class="info">
    7 кадров | background-size: 700% | steps(6)<br>
    позиции: 0% → 16.7% → 33.3% → 50% → 66.7% → 83.3% → 100%
  </div>

<script>
  const sprite = document.getElementById('sprite');
  const box = document.getElementById('spriteBox');
  const slider = document.getElementById('speedSlider');
  const label = document.getElementById('speedLabel');

  function clearAnim() { sprite.className = 'sprite'; }

  function stop() {
    clearAnim();
    sprite.classList.add('frame-0');
  }

  function playLoop() {
    clearAnim();
    void sprite.offsetWidth;
    sprite.classList.add('playing');
  }

  function playOnce() {
    clearAnim();
    void sprite.offsetWidth;
    sprite.classList.add('playing-once');
  }

  function goFrame(n) {
    clearAnim();
    sprite.classList.add('frame-' + n);
  }

  function setSize(cls) { box.className = 'sprite-box ' + cls; }

  function setBg(cls) {
    box.className = box.className.replace(/bg-\w+/g, '').trim();
    if (cls) box.classList.add(cls);
  }

  slider.addEventListener('input', () => {
    label.textContent = slider.value + 's';
    sprite.style.setProperty('--duration', slider.value + 's');
  });
</script>

</body>
</html>

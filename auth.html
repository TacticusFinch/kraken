<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken — Вход</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* Полный отказ от скруглений для достижения максимальной строгости */
        border-radius: 0 !important;
        /* Плавный отклик элементов в стиле интерфейсов Apple */
        transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    body {
        /* Системный шрифт Apple (San Francisco) задает чистоту и премиальность */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f5f5f7; /* Нейтральный светло-серый фон Apple */
        color: #1d1d1f;      /* Глубокий черный цвет текста */
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-font-smoothing: antialiased;
    }

    .auth-container {
        background: #ffffff; 
        padding: 44px 40px;
        width: 400px;
        max-width: 90vw;
        /* Тонкая строгая рамка вместо тяжелых теней подчеркивает графичность */
        border: 1px solid #d2d2d7;
        /* Едва заметная тень для легкого отделения от фона */
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }

    .auth-logo {
        text-align: center;
        margin-bottom: 36px;
    }

    .auth-logo h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #1d1d1f;
    }

    .auth-logo p {
        color: #86868b;
        margin-top: 6px;
        font-size: 14px;
        font-weight: 400;
    }

    .tabs {
        display: flex;
        margin-bottom: 28px;
        background: #eeeef0; /* Родной серый фон переключателя Apple */
        padding: 2px;
    }

    .tab {
        flex: 1;
        padding: 9px 0;
        text-align: center;
        cursor: pointer;
        color: #1d1d1f;
        font-size: 13px;
        font-weight: 500;
        border: none;
        background: transparent;
    }

    /* Монохромный активный таб с острыми углами */
    .tab.active {
        background: #ffffff;
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.08);
        font-weight: 600;
    }

    .tab:hover:not(.active) {
        opacity: 0.6;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #86868b;
        text-transform: uppercase; /* Добавляет строгости текстовым меткам */
        letter-spacing: 0.5px;
    }

    .form-group input {
        width: 100%;
        padding: 14px 16px;
        background: #ffffff;
        border: 1px solid #d2d2d7; 
        color: #1d1d1f;
        font-size: 15px;
        outline: none;
    }

    /* Монохромный строгий фокус */
    .form-group input:focus {
        border-color: #1d1d1f;
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
    }

    .form-group input::placeholder {
        color: #86868b;
        opacity: 0.6;
    }

    .btn {
        width: 100%;
        padding: 14px;
        border: none;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    /* Монолитная черная кнопка */
    .btn-primary {
        background: #1d1d1f;
        color: #ffffff;
    }

    .btn-primary:hover {
        background: #000000;
    }

    .btn-primary:active {
        opacity: 0.85;
    }

    /* Минималистичная контрастная кнопка Lichess */
    .btn-lichess {
        background: #ffffff;
        color: #1d1d1f;
        border: 1px solid #d2d2d7;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 4px;
    }

    .btn-lichess:hover {
        background: #f5f5f7;
    }

    .btn-lichess img {
        width: 18px;
        height: 18px;
        filter: invert(0); 
    }

    .divider {
        text-align: center;
        margin: 24px 0;
        color: #86868b;
        position: relative;
        font-size: 12px;
        font-weight: 400;
    }

    .divider::before,
    .divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 40%;
        height: 1px;
        background: #e5e5ea;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .message {
        padding: 12px 16px;
        margin-bottom: 20px;
        display: none;
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        border: 1px solid #e5e5ea;
    }

    /* Монохромные прямоугольные плашки уведомлений */
    .message.error {
        background: #fafafa;
        color: #1d1d1f;
        border-color: #d2d2d7;
        font-weight: 600;
        display: block;
    }

    .message.success {
        background: #1d1d1f;
        color: #ffffff;
        border-color: #1d1d1f;
        display: block;
    }

    .auth-form {
        display: none;
    }

    .auth-form.active {
        display: block;
    }

    .guest-link {
        text-align: center;
        margin-top: 24px;
    }

    .guest-link a {
        color: #1d1d1f;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
    }

    .guest-link a:hover {
        text-decoration: underline;
    }
</style>


</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <h1>Kraken</h1>
            <p>Дебютный тренажёр</p>
        </div>

        <div id="message" class="message"></div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Вход</button>
            <button class="tab" onclick="switchTab('register')">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <!-- Форма регистрации -->
        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="regUsername" required placeholder="KrakenMaster"
                       minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="regPassword" required placeholder="Минимум 6 символов"
                       minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>

        <div class="divider">или</div>

        <button class="btn btn-lichess" onclick="loginLichess()">
            <img src="https://lichess1.org/assets/logo/lichess-favicon-32.png" alt="Lichess">
            Войти через Lichess
        </button>

        <div class="guest-link">
            <a href="/">Продолжить без входа →</a>
        </div>
    </div>

    <script>
        // Переключение табов
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            hideMessage();
        }

        // Показ сообщений
        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        function hideMessage() {
            document.getElementById('message').className = 'message';
        }

        // Регистрация
        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('Регистрация успешна! Теперь войдите.', 'success');
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showMessage(data.message || 'Ошибка регистрации', 'error');
                }
            } catch (err) {
                showMessage('Ошибка сети', 'error');
            }
        }

        // Вход
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('Вход выполнен!', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showMessage(data.message || 'Неверный email или пароль', 'error');
                }
            } catch (err) {
                showMessage('Ошибка сети', 'error');
            }
        }

        // Вход через Lichess
        function loginLichess() {
            window.location.href = '/api/auth/lichess';
        }

        // Если уже залогинен — редирект на главную
        fetch('/api/user/me')
            .then(r => r.json())
            .then(data => {
                if (data.loggedIn) {
                    window.location.href = '/';
                }
            });
    </script>
</body>
</html>

meta:
  environment: node
  toolchain:
    name: npm
    version: 22

build:
  install: npm install

run:
  # Если скрипта start нет, укажите напрямую главный файл, например:
  command: node server.js
  
  # Точка монтирования постоянного хранилища Amvera (см. Важное замечание ниже)
  persistenceMount: /app/data